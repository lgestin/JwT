[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tts"
description = "Text-to-speech library"
readme = "README.md"
license = "MIT"
requires-python = ">=3.13"
authors = [{ name = "Lucas" }]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "License :: OSI Approved :: MIT License",
    "Typing :: Typed",
]
dynamic = ["version"]
dependencies = [
    "av>=17.0.1",
    "einops>=0.8",
    "misaki[en]>=0.9.4",
    "pyarrow>=18.0",
    "rich>=15.0.0",
    "simple-parsing>=0.1.8",
    "soundfile>=0.13.1",
    "torch>=2.12.0",
    "torchaudio>=2.11.0",
    "torchcodec>=0.11.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.8",
    "ty",
    "ipython",
    "marimo>=0.9",
]
bigvgan = [
    "bigvgan>=2.4.1",
]

[tool.hatch.version]
path = "src/tts/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/tts"]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "B",
    "UP",
    "SIM",
    "RUF",
]

[tool.ty.src]
include = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
