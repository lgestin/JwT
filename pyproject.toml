[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "jwt"
description = "Just Waveform Transformers — streaming TTS via rolling flow matching on raw-waveform patches"
readme = "README.md"
license = "MIT"
requires-python = ">=3.13"
authors = [{ name = "Lucas Gestin" }]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "License :: OSI Approved :: MIT License",
    "Typing :: Typed",
]
dynamic = ["version"]
dependencies = [
    "av>=17.0.1",
    "bigvgan>=2.4.1",
    "einops>=0.8",
    "flash-attn",
    "marimo>=0.23.6",
    # Renders the by-t diagnostic curves for the TensorBoard Images tab.
    "matplotlib>=3.8",
    "misaki[en]>=0.9.4",
    "pyarrow>=18.0",
    "pyyaml>=6.0",
    "rich>=15.0.0",
    "simple-parsing>=0.1.8",
    "soundfile>=0.13.1",
    "tensorboard>=2.20.0",
    # [audio] pulls pesq/pystoi for the validation-time perceptual metrics;
    # >=1.6 is the floor for NISQA (non_intrusive_speech_quality_assessment).
    "torchmetrics[audio]>=1.6",
    "torch>=2.12.0",
    "torchaudio>=2.11.0",
    "torchcodec>=0.11.1",
    "wandb>=0.19",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.16",
    "ty",
    "ipython",
    "marimo>=0.9",
]
demo = [
    "gradio>=5.0",
]

[tool.uv]
# Our local package is named `jwt`, which collides with PyJWT.
# Force a resolution failure if anything ever transitively requires PyJWT.
constraint-dependencies = ["pyjwt<0"]

[tool.uv.extra-build-dependencies]
flash-attn = ["torch", "setuptools", "wheel", "packaging", "psutil", "ninja"]

[tool.uv.sources]
flash-attn = { url = "https://github.com/Dao-AILab/flash-attention/releases/download/v2.8.1/flash_attn-2.8.1+cu13torch2.10cxx11abiTRUE-cp313-cp313-linux_x86_64.whl" }

[tool.hatch.version]
path = "src/jwt/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/jwt"]

[tool.ruff]
target-version = "py313"
line-length = 88
extend-exclude = ["notebooks", "docs"]

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "B",
    "UP",
    "SIM",
    "RUF",
]

[tool.ty.src]
include = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
