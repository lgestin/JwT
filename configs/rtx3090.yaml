# Adversarial training config tuned for a single RTX 3090 (24 GB).
#
# Raw-audio JWT at 8 kHz, patch 256 (RawAudio256) with the multi-resolution STFT
# GAN enabled on top of the existing log-mel L1 aux loss. Patch 256 keeps the
# transformer sequence short; the discriminator runs on the full decoded
# waveform, so batch size is the memory lever — batch 20 peaks ~17 GB, leaving
# headroom for the longest LJSpeech clips. The discriminator FFT sizes are scaled
# for 8 kHz. The generator warms up on FM (+mel) for adv_start_step before the
# GAN turns on. Validated end-to-end on an RTX 3090 with compile + resume.
#
# Build the patch-256 arrow once (reuses the existing raw64 waveforms, no
# re-download) then launch:
#   uv run python scripts/data/rearrow_raw_patch.py \
#     --input_path data/ljspeech_8khz.raw64.arrow \
#     --output_path data/ljspeech_8khz.raw256.arrow --patch_size 256
#   uv run python scripts/train.py --config_path configs/rtx3090.yaml

arrow_path: data/ljspeech_8khz.raw256.arrow
batch_size: 24
codec: RAWAUDIO_256
compile: true
ema:
  decay: 0.9995
  enabled: false
model:
  acoustic_dim: 256
  eos_n_frames: 8
  max_acoustic_len: 2048
  n_denoising_steps: 32
  parametrization: JWT
  transformer_config:
    dim: 256
    max_seq_len: 8192
    mlp_ratio: 2.67
    num_heads: 8
    num_layers: 8
    rope_theta: 10000.0
    time_freq_embed_dim: 256
  vocabulary_size: 0
n_valid: 64
num_workers: 6
optimizer:
  betas:
    - 0.9
    - 0.999
  lr: 3e-4
  warmup_steps: 2500
  weight_decay: 0.0
output_dir: outputs/run_rtx3090_adv
resume: false
trainer:
  amp_dtype: BF16
  aux_mel_weight: 0.1
  # --- Adversarial (multi-resolution STFT GAN) ---
  adv_weight: 1.0
  feat_match_weight: 10.0
  disc_lr: 2e-4
  disc_n_fft: [1024, 512, 256, 128, 64]
  adv_start_step: 5000
  # ----------------------------------------------
  checkpoint_steps: 5000
  clip_grad_norm: 1.0
  device: cuda
  grad_accum_steps: 2
  log_steps: 100
  max_steps: 500001
  n_loss_bins: 10
  n_smp: 16
  smp_steps: 2500
  valid_steps: 1000
use_tensorboard: true
vocab_path: data/vocabulary.json
