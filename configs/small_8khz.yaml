# Example training config for scripts/train.py — copy this file and edit it.
#
# --config_path is required; there is no default config.
#
# Launch:              uv run python scripts/train.py --config_path configs/example.yaml
# Override one value:  uv run python scripts/train.py --config_path configs/example.yaml --batch_size 32
#
# The resolved config of each run is written to <output_dir>/config.yaml.
# To resume a run, point --config_path at that run's saved config.yaml.

arrow_path: data/ljspeech_8khz.raw64.arrow
batch_size: 64
codec: RAWAUDIO_64
compile: true
ema:
  decay: 0.9995
  enabled: false
model:
  acoustic_dim: 128
  eos_n_frames: 3
  max_acoustic_len: 2048
  n_denoising_steps: 32
  parametrization: JWT
  transformer_config:
    adaln_rank: 32
    dim: 128
    max_seq_len: 8192
    mlp_ratio: 2.0
    num_heads: 4
    num_layers: 8
    rope_theta: 10000.0
    time_freq_embed_dim: 128
  vocabulary_size: 0
n_valid: 64
num_workers: 6
optimizer:
  betas:
    - 0.9
    - 0.999
  lr: 0.01
  warmup_steps: 2500
  weight_decay: 0.0
output_dir: outputs/run_small_8khz
resume: false
trainer:
  amp_dtype: BF16
  aux_mel_weight: 0.1
  checkpoint_steps: 5000
  clip_grad_norm: 1.0
  device: cuda
  grad_accum_steps: 1
  hist_steps: 500
  log_steps: 100
  max_steps: 500001
  n_loss_bins: 10
  n_smp: 16
  smp_steps: 2500
  valid_steps: 1000
use_tensorboard: true
vocab_path: data/vocabulary.json
