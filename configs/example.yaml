# Example training config for scripts/train.py — copy this file and edit it.
#
# --config_path is required; there is no default config.
#
# Launch:              uv run python scripts/train.py --config_path configs/example.yaml
# Override one value:  uv run python scripts/train.py --config_path configs/example.yaml --batch_size 32
#
# The resolved config of each run is written to <output_dir>/config.yaml.
# To resume a run, point --config_path at that run's saved config.yaml.

arrow_path: data/ljspeech_24khz_bigvgan.arrow
batch_size: 64
codec: BIGVGAN
compile: true
ema:
  decay: 0.9995
  enabled: true
model:
  acoustic_dim: 100
  codec: RAWAUDIO_128
  eos_n_frames: 3
  max_acoustic_len: 2048
  n_denoising_steps: 32
  noise_scale: 1.0
  parametrization: JWT
  timestep_schedule: LOG_NORM
  transformer_config:
    dim: 256
    max_seq_len: 8192
    mlp_ratio: 2.67
    num_heads: 4
    num_layers: 10
    rope_theta: 10000.0
    time_freq_embed_dim: 256
  vocabulary_size: 0
n_train: null
n_valid: 64
num_workers: 6
optimizer:
  betas:
  - 0.9
  - 0.999
  lr: 0.001
  warmup_steps: 0
  weight_decay: 0.01
output_dir: outputs/run0
resume: false
trainer:
  amp_dtype: BF16
  attention_implementation: FLASH_VARLEN
  aux_stft_weight: 0.0
  aux_mel_weight: 0.0
  checkpoint_steps: 5000
  clip_grad_norm: 1.0
  device: cuda
  grad_accum_steps: 1
  log_steps: 100
  loss_fn: L1
  max_steps: 200001
  n_loss_bins: 10
  n_smp: 16
  smp_steps: 2500
  valid_steps: 1000
use_tensorboard: true
vocab_path: data/vocabulary.json
